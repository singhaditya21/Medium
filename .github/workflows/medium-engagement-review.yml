name: Medium Engagement Review

on:
  schedule:
    - cron: "41 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate and prepare engagement review
        run: python scripts/validate_medium_bridge.py --output-dir medium-engagement-review
      - name: Add operating instructions
        run: |
          {
            printf '\n## Signed-in review request\n\n'
            printf '1. Sign in to Medium in Chrome.\n'
            printf '2. Ask Codex to inspect relevant inbound responses and no more than five strong outbound candidates for this issue.\n'
            printf '3. Read each source before drafting; do not create generic promotional responses.\n'
            printf '4. Review the exact target and full response text. A queue entry is not posting permission.\n'
            printf '5. Confirm each exact public response immediately before it is posted.\n'
            printf '6. After visible verification, record a response_posted receipt and merge it so GitHub Actions can continue.\n\n'
            printf 'GitHub Actions does not sign in, read Medium feeds, or post account interactions.\n'
          } >> medium-engagement-review/summary.md
      - name: Upload review package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: medium-engagement-review-${{ github.run_number }}
          path: medium-engagement-review
          retention-days: 30
      - name: Open one weekly signed-in review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create medium-engagement --color BFDADC --description "Curated Medium engagement review" --force
          gh label create awaiting-signed-in-execution --color FBCA04 --description "Waiting for a user-initiated signed-in Medium step" --force
          week="$(date -u +%G-W%V)"
          issue_title="Medium engagement review · $week"
          existing="$(gh issue list --state all --search "$issue_title in:title" --json title --limit 100 | jq --arg title "$issue_title" 'map(select(.title == $title)) | length')"
          if [[ "$existing" == "0" ]]; then
            gh issue create --title "$issue_title" --body-file medium-engagement-review/summary.md --label medium-engagement --label awaiting-signed-in-execution
          fi
