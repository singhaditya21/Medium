name: Cross-Platform Engagement Automation

on:
  schedule:
    - cron: "35 3 * * 1-5"
    - cron: "35 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cross-platform-engagement-review
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate control planes
        run: |
          python scripts/validate_medium_bridge.py --output-dir engagement-review/medium
          python scripts/validate_engagement_automation.py --output-dir engagement-review/validation
      - name: Generate calendar, queue, and measurement packet
        run: python scripts/generate_engagement_review.py --output-dir engagement-review
      - name: Upload operating packet
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cross-platform-engagement-${{ github.run_number }}
          path: engagement-review
          retention-days: 30
      - name: Open or refresh one weekly control issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create engagement-review --color 1D76DB --description "Medium and LinkedIn engagement control surface" --force
          gh label create medium-engagement --color BFDADC --description "Curated Medium engagement review" --force
          gh label create linkedin-engagement --color 0A66C2 --description "Curated LinkedIn engagement review" --force
          gh label create awaiting-signed-in-execution --color FBCA04 --description "Waiting for an individually approved signed-in step" --force
          week="$(date -u +%G-W%V)"
          issue_title="Cross-platform engagement review · $week"
          issue_number="$(gh issue list --state all --search "$issue_title in:title" --json number,title --limit 100 | jq -r --arg title "$issue_title" 'map(select(.title == $title))[0].number // empty')"
          if [[ -z "$issue_number" ]]; then
            gh issue create \
              --title "$issue_title" \
              --body-file engagement-review/summary.md \
              --label engagement-review \
              --label medium-engagement \
              --label linkedin-engagement \
              --label awaiting-signed-in-execution
          else
            gh issue reopen "$issue_number" || true
            gh issue edit "$issue_number" \
              --body-file engagement-review/summary.md \
              --add-label engagement-review \
              --add-label medium-engagement \
              --add-label linkedin-engagement \
              --add-label awaiting-signed-in-execution
          fi
