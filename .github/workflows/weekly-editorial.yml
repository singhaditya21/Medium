name: Weekly Editorial Brief

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Generate weekly brief
        run: python scripts/generate_weekly_editorial.py --output-dir editorial-brief
      - name: Create the review issue once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_title="$(tr -d '\n' < editorial-brief/title.txt)"
          existing="$(gh issue list --state all --search "$issue_title in:title" --json title --limit 100 | jq --arg title "$issue_title" 'map(select(.title == $title)) | length')"
          if [[ "$existing" == "0" ]]; then
            gh issue create --title "$issue_title" --body-file editorial-brief/body.md
          fi
