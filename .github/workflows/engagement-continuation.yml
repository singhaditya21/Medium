name: LinkedIn Signed-In Continuation

on:
  push:
    branches: [main]
    paths:
      - "linkedin/executions/*.json"
      - "linkedin/execution.schema.json"
      - "engagement/queue.json"
      - "engagement/queue.schema.json"
      - "engagement/strategy.json"
      - "scripts/record_linkedin_execution.py"
      - "scripts/render_linkedin_receipt.py"
      - "scripts/validate_engagement_automation.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  continue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate unified queue and receipts
        run: |
          python scripts/validate_medium_bridge.py
          python scripts/validate_engagement_automation.py --output-dir engagement-continuation-report
      - name: Upload continuation report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linkedin-continuation-${{ github.run_number }}
          path: engagement-continuation-report
          retention-days: 90
      - name: Resume originating GitHub issues
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          gh label create linkedin-engagement --color 0A66C2 --description "Curated LinkedIn engagement review" --force
          gh label create awaiting-signed-in-execution --color FBCA04 --description "Waiting for an individually approved signed-in step" --force
          gh label create linkedin-comment-posted --color 0E8A16 --description "One approved LinkedIn comment was visibly verified" --force
          gh label create linkedin-reply-posted --color 5319E7 --description "One approved LinkedIn reply was visibly verified" --force
          gh label create linkedin-author-comment-posted --color BFD4F2 --description "One approved LinkedIn author comment was visibly verified" --force

          remove_label_if_present() {
            local issue_number="$1"
            local label="$2"
            if gh issue view "$issue_number" --json labels --jq '.labels[].name' | grep -Fxq "$label"; then
              gh issue edit "$issue_number" --remove-label "$label"
            fi
          }

          while IFS= read -r receipt_path; do
            [[ -z "$receipt_path" ]] && continue
            issue_number="$(jq -r '.githubIssueNumber' "$receipt_path")"
            operation_id="$(jq -r '.operationId' "$receipt_path")"
            action="$(jq -r '.action' "$receipt_path")"
            marker="<!-- linkedin-execution:$operation_id -->"
            if ! gh issue view "$issue_number" --json labels --jq '.labels[].name' | grep -Fxq linkedin-engagement; then
              printf 'Issue #%s is not labeled linkedin-engagement; refusing receipt transition.\n' "$issue_number" >&2
              exit 1
            fi
            comment_body="$(mktemp)"
            python scripts/render_linkedin_receipt.py --receipt "$receipt_path" > "$comment_body"
            printf '\n- Continuation run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$comment_body"
            if ! gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh issue comment "$issue_number" --body-file "$comment_body"
            fi
            case "$action" in
              comment_posted) gh issue edit "$issue_number" --add-label linkedin-comment-posted ;;
              reply_posted) gh issue edit "$issue_number" --add-label linkedin-reply-posted ;;
              author_comment_posted) gh issue edit "$issue_number" --add-label linkedin-author-comment-posted ;;
            esac
            if [[ "$(jq '[.candidates[] | select(.state == "ready_for_confirmation")] | length' engagement/queue.json)" == "0" ]]; then
              remove_label_if_present "$issue_number" awaiting-signed-in-execution
            fi
            rm -f "$comment_body"
          done < <(git diff --diff-filter=A --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'linkedin/executions/*.json')
