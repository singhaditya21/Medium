name: Content CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile, build, validate, and stage
        run: |
          python -m py_compile scripts/*.py
          python scripts/build_site.py
          python scripts/validate_site.py
          python scripts/stage_pages.py
      - name: Generate review-only distribution packs
        run: python scripts/generate_distribution_pack.py --all --output-dir distribution-packs
      - name: Upload distribution packs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-packs
          path: distribution-packs
          retention-days: 14
