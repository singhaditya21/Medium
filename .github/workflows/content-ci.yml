name: Content CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "analytics/**"
      - "engagement/**"
      - "linkedin/**"
      - "medium/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile, build, validate, and stage
        run: |
          python -m py_compile scripts/*.py
          python scripts/build_site.py
          python scripts/validate_site.py
          python scripts/stage_pages.py
      - name: Generate review-only distribution packs
        run: python scripts/generate_distribution_pack.py --all --output-dir distribution-packs
      - name: Validate Medium release configurations
        run: python scripts/prepare_medium_release.py --all --strict --output-dir medium-release-bundles
      - name: Validate signed-in Medium continuation state
        run: python scripts/validate_medium_bridge.py --output-dir medium-continuation-report
      - name: Validate and generate cross-platform engagement controls
        run: |
          python scripts/validate_engagement_automation.py --output-dir engagement-continuation-report
          python scripts/generate_engagement_review.py --as-of 2026-08-27T12:00:00Z --output-dir engagement-review
      - name: Upload distribution packs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distribution-packs
          path: distribution-packs
          retention-days: 14
