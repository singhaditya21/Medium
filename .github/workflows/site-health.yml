name: Site Health

on:
  schedule:
    - cron: "23 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Build current site
        run: python scripts/build_site.py
      - name: Validate generated and live pages
        id: health
        continue-on-error: true
        run: python scripts/validate_site.py --live 2>&1 | tee site-health.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-health-${{ github.run_number }}
          path: site-health.log
          retention-days: 14
      - name: Open one health issue on failure
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_title="Site health check failed"
          existing="$(gh issue list --state open --search "$issue_title in:title" --json title --limit 100 | jq --arg title "$issue_title" 'map(select(.title == $title)) | length')"
          if [[ "$existing" == "0" ]]; then
            gh issue create --title "$issue_title" --body-file site-health.log
          fi
          exit 1
