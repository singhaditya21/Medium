name: Metrics Report

on:
  push:
    branches: [main]
    paths:
      - "analytics/**"
      - "scripts/generate_metrics_report.py"
  schedule:
    - cron: "53 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate snapshot and generate report
        run: python scripts/generate_metrics_report.py --output-dir metrics-report
      - name: Include source-backed dashboard
        run: cp analytics/engagement-dashboard.html metrics-report/engagement-dashboard.html
      - name: Upload metrics review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metrics-report-${{ github.run_number }}
          path: metrics-report
          retention-days: 90
      - name: Open monthly manual-refresh issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month="$(date -u +%Y-%m)"
          issue_title="Metrics refresh · $month"
          existing="$(gh issue list --state all --search "$issue_title in:title" --json title --limit 100 | jq --arg title "$issue_title" 'map(select(.title == $title)) | length')"
          if [[ "$existing" == "0" ]]; then
            gh issue create --title "$issue_title" --body "Refresh analytics/engagement-baseline.json from a signed-in, read-only Medium Stats review; rebuild the canonical dashboard; record UTM/referrer data from the selected privacy-friendly analytics provider; and compare the new period with the previous snapshot. Do not store Medium cookies or credentials in GitHub."
          fi
