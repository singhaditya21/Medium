name: Metrics Report

on:
  push:
    branches: [main]
    paths:
      - "analytics/**"
      - "scripts/generate_metrics_report.py"
  schedule:
    - cron: "53 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate snapshot and generate report
        run: |
          python scripts/validate_medium_bridge.py --output-dir medium-continuation-report
          python scripts/validate_engagement_automation.py --output-dir metrics-report/cross-platform-validation
          python scripts/generate_metrics_report.py --output-dir metrics-report
          python scripts/generate_engagement_review.py --output-dir metrics-report/cross-platform-review
          cp medium-continuation-report/snapshot-history.csv metrics-report/snapshot-history.csv
          cp medium-continuation-report/engagement-queue.csv metrics-report/engagement-queue.csv
          cp medium-continuation-report/summary.md metrics-report/signed-in-bridge-summary.md
      - name: Include source-backed dashboard
        run: cp analytics/engagement-dashboard.html metrics-report/engagement-dashboard.html
      - name: Upload metrics review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: metrics-report-${{ github.run_number }}
          path: metrics-report
          retention-days: 90
      - name: Open monthly cross-platform refresh issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create medium-metrics --color 5319E7 --description "Medium aggregate metrics review" --force
          gh label create cross-platform-metrics --color 0A66C2 --description "Medium and LinkedIn aggregate metrics review" --force
          gh label create awaiting-signed-in-execution --color FBCA04 --description "Waiting for a user-initiated signed-in Medium step" --force
          month="$(date -u +%Y-%m)"
          issue_title="Metrics refresh · $month"
          existing="$(gh issue list --state all --search "$issue_title in:title" --json title --limit 100 | jq --arg title "$issue_title" 'map(select(.title == $title)) | length')"
          if [[ "$existing" == "0" ]]; then
            gh issue create --title "$issue_title" --label medium-metrics --label cross-platform-metrics --label awaiting-signed-in-execution --body "Refresh Medium and LinkedIn aggregate metrics through user-initiated, signed-in, read-only reviews; update the dated cross-platform baseline and the canonical Medium snapshot; rebuild the dashboard; record UTM/referrer data from the selected privacy-friendly analytics provider; and compare 48-hour, 7-day, and 28-day windows. After visible verification, create the Medium stats_captured receipt linked to this issue. Do not store cookies, credentials, private URLs, or person-level audience data in GitHub."
          fi
