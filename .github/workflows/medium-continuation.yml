name: Medium Signed-In Continuation

on:
  push:
    branches: [main]
    paths:
      - "medium/executions/*.json"
      - "medium/execution.schema.json"
      - "medium/publications.json"
      - "analytics/engagement-baseline.json"
      - "analytics/snapshots/*.json"
      - "engagement/queue.json"
      - "scripts/validate_medium_bridge.py"
      - "scripts/render_medium_receipt.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  continue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate receipt, analytics, registry, and engagement state
        run: python scripts/validate_medium_bridge.py --output-dir medium-continuation-report
      - name: Upload continuation report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: medium-continuation-${{ github.run_number }}
          path: medium-continuation-report
          retention-days: 90
      - name: Resume originating GitHub issues
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          gh label create medium-release --color 1D76DB --description "Medium release orchestration" --force
          gh label create awaiting-signed-in-execution --color FBCA04 --description "Waiting for a user-initiated signed-in Medium step" --force
          gh label create medium-draft-saved --color C2E0C6 --description "Private Medium draft was visibly verified" --force
          gh label create medium-draft-revised --color 0E8A16 --description "Scheduled Medium draft revision was visibly verified" --force
          gh label create medium-scheduled --color 0052CC --description "Medium schedule was visibly verified" --force
          gh label create medium-published --color 0E8A16 --description "Medium publication was visibly verified" --force
          gh label create medium-stats-captured --color 5319E7 --description "Aggregate Medium stats were captured through a signed-in read-only review" --force
          gh label create medium-response-posted --color BFDADC --description "One approved Medium response was visibly verified" --force

          remove_label_if_present() {
            local issue_number="$1"
            local label="$2"
            if gh issue view "$issue_number" --json labels --jq '.labels[].name' | grep -Fxq "$label"; then
              gh issue edit "$issue_number" --remove-label "$label"
            fi
          }

          while IFS= read -r receipt_path; do
            [[ -z "$receipt_path" ]] && continue
            issue_number="$(jq -r '.githubIssueNumber' "$receipt_path")"
            operation_id="$(jq -r '.operationId' "$receipt_path")"
            action="$(jq -r '.action' "$receipt_path")"
            marker="<!-- medium-execution:$operation_id -->"
            comment_body="$(mktemp)"
            case "$action" in
              draft_imported|draft_revised|story_scheduled|story_published) expected_issue_label="medium-release" ;;
              stats_captured) expected_issue_label="medium-metrics" ;;
              response_posted) expected_issue_label="medium-engagement" ;;
            esac
            if ! gh issue view "$issue_number" --json labels --jq '.labels[].name' | grep -Fxq "$expected_issue_label"; then
              printf 'Issue #%s is not labeled %s; refusing receipt transition.\n' "$issue_number" "$expected_issue_label" >&2
              exit 1
            fi
            python scripts/render_medium_receipt.py --receipt "$receipt_path" > "$comment_body"
            printf '\n- Continuation run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$comment_body"

            if ! gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh issue comment "$issue_number" --body-file "$comment_body"
            fi

            case "$action" in
              draft_imported)
                remove_label_if_present "$issue_number" awaiting-signed-in-execution
                gh issue edit "$issue_number" --add-label medium-draft-saved
                ;;
              draft_revised)
                remove_label_if_present "$issue_number" awaiting-signed-in-execution
                gh issue edit "$issue_number" --add-label medium-draft-revised
                ;;
              story_scheduled)
                remove_label_if_present "$issue_number" awaiting-signed-in-execution
                remove_label_if_present "$issue_number" medium-draft-saved
                gh issue edit "$issue_number" --add-label medium-scheduled
                ;;
              story_published)
                remove_label_if_present "$issue_number" awaiting-signed-in-execution
                remove_label_if_present "$issue_number" medium-draft-saved
                remove_label_if_present "$issue_number" medium-scheduled
                gh issue edit "$issue_number" --add-label medium-published
                gh issue close "$issue_number" --reason completed
                ;;
              stats_captured)
                gh issue edit "$issue_number" --add-label medium-stats-captured
                gh issue close "$issue_number" --reason completed
                ;;
              response_posted)
                gh issue edit "$issue_number" --add-label medium-response-posted
                if [[ "$(jq '[.candidates[] | select(.state == "ready_for_confirmation")] | length' engagement/queue.json)" == "0" ]]; then
                  remove_label_if_present "$issue_number" awaiting-signed-in-execution
                fi
                ;;
            esac
            rm -f "$comment_body"
          done < <(git diff --diff-filter=A --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'medium/executions/*.json')
