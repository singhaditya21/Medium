<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f6d65"/></marker></defs><rect width="1600" height="1000" fill="#fbfaf7"/><text x="72" y="76" font-size="42" font-weight="760" fill="#0d2425">Policy compilation and runtime path</text><text x="74" y="145" font-size="23" font-weight="500" fill="#526562">Governance moves from prose to an immutable execution decision.</text><rect x="70" y="210" width="1460" height="610" rx="28" fill="#ffffff" stroke="#cad8d5" stroke-width="2"/><line x1="385" y1="356" x2="447" y2="356" stroke="#1f6d65" stroke-width="5" marker-end="url(#a)"/><rect x="120" y="270" width="265" height="172" rx="22" fill="#0d2425" stroke="#2a6f68" stroke-width="2"/><text x="148" y="322" font-size="25" font-weight="740" fill="#ffffff">SOURCE</text><text x="148" y="388" font-size="18" font-weight="500" fill="#cce9e3">Policy and rationale</text><text x="148" y="412" font-size="18" font-weight="500" fill="#cce9e3">reviewed</text><line x1="740" y1="356" x2="802" y2="356" stroke="#1f6d65" stroke-width="5" marker-end="url(#a)"/><rect x="475" y="270" width="265" height="172" rx="22" fill="#e8f3f0" stroke="#2a6f68" stroke-width="2"/><text x="503" y="322" font-size="25" font-weight="740" fill="#0d2425">SCHEMA</text><text x="503" y="388" font-size="18" font-weight="500" fill="#3b5b57">Inputs and entities</text><text x="503" y="412" font-size="18" font-weight="500" fill="#3b5b57">typed</text><line x1="1095" y1="356" x2="1157" y2="356" stroke="#1f6d65" stroke-width="5" marker-end="url(#a)"/><rect x="830" y="270" width="265" height="172" rx="22" fill="#e8f3f0" stroke="#2a6f68" stroke-width="2"/><text x="858" y="322" font-size="25" font-weight="740" fill="#0d2425">ANALYZE</text><text x="858" y="388" font-size="18" font-weight="500" fill="#3b5b57">Conflict and</text><text x="858" y="412" font-size="18" font-weight="500" fill="#3b5b57">reachability tests</text><path d="M 1317 442 C 1317 500, 252 490, 252 533" fill="none" stroke="#1f6d65" stroke-width="5" marker-end="url(#a)"/><rect x="1185" y="270" width="265" height="172" rx="22" fill="#e8f3f0" stroke="#2a6f68" stroke-width="2"/><text x="1213" y="322" font-size="25" font-weight="740" fill="#0d2425">TEST</text><text x="1213" y="388" font-size="18" font-weight="500" fill="#3b5b57">Golden and adversarial</text><text x="1213" y="412" font-size="18" font-weight="500" fill="#3b5b57">cases</text><line x1="385" y1="641" x2="447" y2="641" stroke="#1f6d65" stroke-width="5" marker-end="url(#a)"/><rect x="120" y="555" width="265" height="172" rx="22" fill="#e8f3f0" stroke="#2a6f68" stroke-width="2"/><text x="148" y="607" font-size="25" font-weight="740" fill="#0d2425">BUNDLE</text><text x="148" y="673" font-size="18" font-weight="500" fill="#3b5b57">Version, sign and</text><text x="148" y="697" font-size="18" font-weight="500" fill="#3b5b57">release</text><line x1="740" y1="641" x2="802" y2="641" stroke="#1f6d65" stroke-width="5" marker-end="url(#a)"/><rect x="475" y="555" width="265" height="172" rx="22" fill="#e8f3f0" stroke="#2a6f68" stroke-width="2"/><text x="503" y="607" font-size="25" font-weight="740" fill="#0d2425">EVALUATE</text><text x="503" y="673" font-size="18" font-weight="500" fill="#3b5b57">Structured runtime</text><text x="503" y="697" font-size="18" font-weight="500" fill="#3b5b57">request</text><line x1="1095" y1="641" x2="1157" y2="641" stroke="#1f6d65" stroke-width="5" marker-end="url(#a)"/><rect x="830" y="555" width="265" height="172" rx="22" fill="#e8f3f0" stroke="#2a6f68" stroke-width="2"/><text x="858" y="607" font-size="25" font-weight="740" fill="#0d2425">OBLIGATE</text><text x="858" y="673" font-size="18" font-weight="500" fill="#3b5b57">Limits and controls</text><text x="858" y="697" font-size="18" font-weight="500" fill="#3b5b57">returned</text><rect x="1185" y="555" width="265" height="172" rx="