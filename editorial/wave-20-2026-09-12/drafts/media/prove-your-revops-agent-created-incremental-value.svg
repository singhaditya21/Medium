<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Prove Your RevOps Agent Created Incremental Value</title><desc id="desc">Six-step reference architecture: Eligible accounts → Stable assignment → Bounded treatment → Exposure record → Mature outcomes → Decision review. Associated revenue is not incremental revenue.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#155cce"/></marker></defs><rect width="1600" height="1040" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="75" y="70" fill="#155cce" font-size="23" font-weight="700">PRODUCTION AGENT ENGINEERING · REFERENCE DESIGN</text><text x="75" y="136" font-size="48" font-weight="700" fill="#111111">Prove Your RevOps Agent Created Incremental</text><text x="75" y="194" font-size="48" font-weight="700" fill="#111111">Value</text><line x1="75" y1="230" x2="1525" y2="230" stroke="#155cce" stroke-width="3"/><rect x="75" y="295" width="450" height="195" rx="16" fill="#ffffff" stroke="#155cce" stroke-width="2"/><text x="103" y="337" fill="#155cce" font-size="24" font-weight="700">01</text><text x="103" y="391" fill="#111111" font-size="30" font-weight="700">Eligible accounts</text><text x="103" y="439" fill="#111111" font-size="23">Pre-treatment rules</text><rect x="575" y="295" width="450" height="195" rx="16" fill="#ffffff" stroke="#155cce" stroke-width="2"/><text x="603" y="337" fill="#155cce" font-size="24" font-weight="700">02</text><text x="603" y="391" fill="#111111" font-size="30" font-weight="700">Stable assignment</text><text x="603" y="439" fill="#111111" font-size="23">Account or cluster unit</text><rect x="1075" y="295" width="450" height="195" rx="16" fill="#ffffff" stroke="#155cce" stroke-width="2"/><text x="1103" y="337" fill="#155cce" font-size="24" font-weight="700">03</text><text x="1103" y="391" fill="#111111" font-size="30" font-weight="700">Bounded treatment</text><text x="1103" y="439" fill="#111111" font-size="23">Same safety controls</text><rect x="1075" y="590" width="450" height="195" rx="16" fill="#ffffff" stroke="#155cce" stroke-width="2"/><text x="1103" y="632" fill="#155cce" font-size="24" font-weight="700">04</text><text x="1103" y="686" fill="#111111" font-size="30" font-weight="700">Exposure record</text><text x="1103" y="734" fill="#111111" font-size="23">Track noncompliance</text><rect x="575" y="590" width="450" height="195" rx="16" fill="#ffffff" stroke="#155cce" stroke-width="2"/><text x="603" y="632" fill="#155cce" font-size="24" font-weight="700">05</text><text x="603" y="686" fill="#111111" font-size="30" font-weight="700">Mature outcomes</text><text x="603" y="734" fill="#111111" font-size="23">Fixed as-of window</text><rect x="75" y="590" width="450" height="195" rx="16" fill="#ffffff" stroke="#155cce" stroke-width="2"/><text x="103" y="632" fill="#155cce" font-size="24" font-weight="700">06</text><text x="103" y="686" fill="#111111" font-size="30" font-weight="700">Decision review</text><text x="103" y="734" fill="#111111" font-size="23">Cost + uncertainty</text><line x1="525" y1="392" x2="568" y2="392" stroke="#155cce" stroke-width="3" marker-end="url(#arrow)"/><line x1="1025" y1="392" x2="1068" y2="392" stroke="#155cce" stroke-width="3" marker-end="url(#arrow)"/><line x1="1300" y1="490" x2="1300" y2="580" stroke="#155cce" stroke-width="3" marker-end="url(#arrow)"/><line x1="1075" y1="687" x2="1035" y2="687" stroke="#155cce" stroke-width="3" marker-end="url(#arrow)"/><line x1="575" y1="687" x2="535" y2="687" stroke="#155cce" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="848" width="1450" height="92" rx="12" fill="#ffffff" stroke="#155cce" stroke-width="2"/><text x="105" y="904" fill="#155cce" font-size="30" font-weight="700">Associated revenue is not incremental revenue</text><text x="75" y="996" fill="#111111" font-size="21">AI-assisted editorial diagram · Proposed design, not a deployed-system claim · Aditya Singh</text></g></svg>
