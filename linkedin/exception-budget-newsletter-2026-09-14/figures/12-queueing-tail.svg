<text x="1437" y="758" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">At ρ ≥ 1, this model has no</text>
<text x="1437" y="789" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">finite stationary waiting-time</text>
<text x="1437" y="820" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">distribution.</text>
<text x="1437" y="851" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">The plot ends at 98%. No curve</text>
