<rect x="968" y="265" width="6" height="220" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="990" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Skill-aware queues</text>
<text x="990" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Routing vs refund vs IAM</text>
<text x="990" y="377" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Deadline + priority class</text>
<text x="990" y="404" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Accountable owner</text>
<text x="990" y="467" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">NO UNLIMITED POOL</text>
