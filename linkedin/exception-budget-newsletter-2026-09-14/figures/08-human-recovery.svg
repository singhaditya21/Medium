<text x="86" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Exception router</text>
<text x="86" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Action + severity + age</text>
<text x="86" y="377" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Unknown effect retained</text>
<text x="86" y="404" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Attach protected evidence</text>
<text x="86" y="467" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">NO GENERIC ALERT DUMP</text>
<rect x="516" y="265" width="392" height="220" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="516" y="265" width="6" height="220" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="538" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Incident grouping</text>
<text x="538" y="350" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Group common root cause</text>
<text x="538" y="377" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Keep all affected actions</text>
<text x="538" y="404" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Avoid duplicate labor logs</text>
<text x="538" y="467" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">DEDUPE ≠ HIDE IMPACT</text>
