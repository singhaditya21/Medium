<text x="64" y="837" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1457c5" font-weight="700" text-anchor="start">03  /  RESOLUTION AND LEARNING</text>
<rect x="1440" y="213" width="416" height="877" rx="10" fill="white" stroke="#bfd2ef" stroke-width="2" />
<text x="1466" y="251" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1457c5" font-weight="700" text-anchor="start">IMPLEMENTATION CONTRACT</text>
<text x="1466" y="294" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Worked daily capacity</text>
<text x="1466" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">4 reviewers × 4 available</text>
<text x="1466" y="363" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">hours = 16 reviewer-hours/day.</text>
<text x="1466" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">At 12 minutes per case, the</text>
<text x="1466" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">fluid capacity is 80</text>
<text x="1466" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">cases/day.</text>
<polyline points="1466,514 1830,514" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Two different clocks</text>
<text x="1466" y="588" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Handling time measures labor.</text>
<text x="1466" y="617" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Calendar waiting includes</text>
<text x="1466" y="646" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">nights, shifts, priority and</text>
<text x="1466" y="675" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">missing skills. The stationary</text>
<text x="1466" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">queue exhibit excludes those</text>
<text x="1466" y="733" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">calendar effects.</text>
<polyline points="1466,768 1830,768" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="802" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Customer-facing risk</text>
<text x="1466" y="842" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">A sent email cannot be unsent.</text>
<text x="1466" y="871" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">A correction is a new action</text>
<text x="1466" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">with its own possible harm,</text>
<text x="1466" y="929" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">evidence and approval</text>
<text x="1466" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">requirement.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">SYSTEM INVARIANT</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">Every unresolved action has an accountable recovery owner. No new autonomy is admitted on the assumption of unlimited human</text>
<text x="87" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">cleanup.</text>
<text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">OBSERVE  /  staffed hours • cases by skill • p95 calendar age • handling minutes • customer correction count</text>
<text x="64" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="400" text-anchor="start">Author-proposed design • White = component / boundary • Solid arrow = execution or evidence • Dashed = policy / control</text>
<text x="1856" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="end">08</text>
