<rect x="516" y="865" width="6" height="220" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="538" y="899" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Case settlement</text>
<text x="538" y="950" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Outcome + owner + effort</text>
<text x="538" y="977" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Partial effects retained</text>
