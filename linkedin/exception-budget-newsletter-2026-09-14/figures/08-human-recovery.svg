<rect x="64" y="565" width="6" height="220" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="86" y="599" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Staffing calendar</text>
<text x="86" y="650" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Available service hours</text>
<text x="86" y="677" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Shifts + breaks + absence</text>
<text x="86" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Reserved emergency work</text>
<text x="86" y="767" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">REAL CAPACITY INPUT</text>
