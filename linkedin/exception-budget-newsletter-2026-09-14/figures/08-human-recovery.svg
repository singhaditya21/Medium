<text x="538" y="599" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Investigation desk</text>
<text x="538" y="650" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Resolve original outcome</text>
<text x="538" y="677" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Record handling minutes</text>
<text x="538" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Escalate unsafe ambiguity</text>
<text x="538" y="767" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">READ BEFORE REISSUE</text>
<rect x="968" y="565" width="392" height="220" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="968" y="565" width="6" height="220" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="990" y="599" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Correction approval</text>
<text x="990" y="650" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Exact corrective delta</text>
<text x="990" y="677" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Current state version</text>
<text x="990" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Separate short-lived grant</text>
<text x="990" y="767" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">NO AUTOMATIC ROLLBACK</text>
