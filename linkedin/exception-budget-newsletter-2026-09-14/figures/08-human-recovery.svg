<rect x="64" y="865" width="6" height="220" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="86" y="899" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">Recovery executor</text>
<text x="86" y="950" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Same enforcement gates</text>
<text x="86" y="977" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Independent verification</text>
<text x="86" y="1004" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Stop on changed context</text>
<text x="86" y="1067" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">CORRECTION MAY FAIL</text>
