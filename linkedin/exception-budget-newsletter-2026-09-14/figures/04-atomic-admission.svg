<text x="1466" y="251" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1457c5" font-weight="700" text-anchor="start">IMPLEMENTATION CONTRACT</text>
<text x="1466" y="294" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Admission inequality</text>
<text x="1466" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">actual_spend +</text>
<text x="1466" y="363" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">unresolved_remaining +</text>
<text x="1466" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">new_forecast ≤</text>
<text x="1466" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">usable_capacity. Use one</text>
<text x="1466" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">period and non-overlapping</text>
<text x="1466" y="479" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">accounting buckets.</text>
<polyline points="1466,514 1830,514" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Distributed workers</text>
<text x="1466" y="588" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">A read-then-increment cache is</text>
<text x="1466" y="617" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">insufficient. Use atomic</text>
<text x="1466" y="646" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">conditional updates or</text>
<text x="1466" y="675" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">disjoint, fenced</text>
<text x="1466" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">sub-allocations whose sum is</text>
<text x="1466" y="733" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">bounded.</text>
<polyline points="1466,768 1830,768" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="802" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Model limit</text>
<text x="1466" y="842" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Expected minutes are a</text>
<text x="1466" y="871" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">planning weight, not a</text>
<text x="1466" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">guarantee. Separate hard caps</text>
<text x="1466" y="929" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">on in-flight actions, age and</text>
<text x="1466" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">severity; actual work can</text>
<text x="1466" y="987" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">exceed reserve.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">SYSTEM INVARIANT</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">Reservation IDs are unique per action and budget period. Cross-region failover must not resurrect a spent or invalidated</text>
<text x="87" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">permit.</text>
