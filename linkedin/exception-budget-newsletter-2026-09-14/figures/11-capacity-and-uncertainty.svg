<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1360" viewBox="0 0 1920 1360" role="img"><title>A 1% exception rate can exceed the recovery budget</title><desc>Hypothetical CRM workload: 10,000 actions/day; 12 minutes/case; 16 reviewer-hours/day.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1457c5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#bfd2ef" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1920" height="1360" rx="10" fill="white" stroke="none" stroke-width="2" />
<text x="64" y="46" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">THE OPERATING AI LEDGER  /  ENGINEERING SERIES</text>
<text x="1856" y="46" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="700" text-anchor="end">EXHIBIT 11  /  ANALYTIC SCENARIO</text>
<text x="64" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#101828" font-weight="700" text-anchor="start">A 1% exception rate can exceed the recovery budget</text>
<text x="64" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">Hypothetical CRM workload: 10,000 actions/day; 12 minutes/case; 16 reviewer-hours/day.</text>
<polyline points="64,181 1856,181" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="74" y="243" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="700" text-anchor="start">A  /  DAILY RECOVERY DEMAND</text>
<text x="74" y="345" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="700" text-anchor="start">0.2% exceptions</text>
<rect x="380" y="309" width="84.0" height="66" rx="0" fill="#edf4ff" stroke="#1457c5" stroke-width="2" />
<text x="479.0" y="351" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">4 h / 20 cases</text>
<text x="74" y="511" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="700" text-anchor="start">1.0% exceptions</text>
<rect x="380" y="475" width="420.0" height="66" rx="0" fill="#edf4ff" stroke="#1457c5" stroke-width="2" />
<text x="815.0" y="517" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">20 h / 100 cases</text>
<text x="74" y="677" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="700" text-anchor="start">2.0% exceptions</text>
<rect x="380" y="641" width="840.0" height="66" rx="0" fill="#edf4ff" stroke="#1457c5" stroke-width="2" />
<text x="1235.0" y="683" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">40 h / 200 cases</text>
<polyline points="380,288 380,735" fill="none" stroke="#bfd2ef" stroke-width="1"  />
<text x="380" y="777" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="middle">0</text>
<polyline points="548,288 548,735" fill="none" stroke="#bfd2ef" stroke-width="1"  />
<text x="548" y="777" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="middle">8</text>
<polyline points="716,288 716,735" fill="none" stroke="#bfd2ef" stroke-width="1"  />
<text x="716" y="777" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="middle">16</text>
<polyline points="884,288 884,735" fill="none" stroke="#bfd2ef" stroke-width="1"  />
<text x="884" y="777" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="middle">24</text>
<polyline points="1052,288 1052,735" fill="none" stroke="#bfd2ef" stroke-width="1"  />
<text x="1052" y="777" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="middle">32</text>
<polyline points="1220,288 1220,735" fill="none" stroke="#bfd2ef" stroke-width="1"  />
<text x="1220" y="777" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="middle">40</text>
<text x="783" y="818" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="middle">Reviewer-hours per day (zero baseline)</text>
<polyline points="632,291 632,735" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<polyline points="420,847 525,847" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" />
<text x="542" y="855" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1457c5" font-weight="700" text-anchor="start">12 h planning allocation</text>
<polyline points="716,291 716,735" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<polyline points="420,894 525,894" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" />
<text x="542" y="902" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1457c5" font-weight="700" text-anchor="start">16 h physical service capacity</text>
<rect x="1415" y="215" width="441" height="842" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="1443" y="257" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1457c5" font-weight="700" text-anchor="start">B  /  STATISTICAL PLANNING</text>
<text x="1443" y="307" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">Hypothetical mature cohort:</text>
<text x="1443" y="338" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">100 exceptions / 10,000</text>
<text x="1443" y="369" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">actions.</text>
<text x="1443" y="400" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">Wilson 95% interval for p:</text>
<text x="1443" y="468" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#1457c5" font-weight="700" text-anchor="start">0.823% – 1.215%</text>
<text x="1443" y="531" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">12 h usable / (p × 12 min)</text>
<text x="1443" y="561" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">Point p = 1%:</text>
<text x="1443" y="644" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#101828" font-weight="700" text-anchor="start">6,000 actions/day</text>
<text x="1443" y="699" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">Using the upper endpoint:</text>
<text x="1443" y="756" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#1457c5" font-weight="700" text-anchor="start">4,939 actions/day</text>
<text x="1443" y="822" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">Rounded down. A conservative</text>
<text x="1443" y="853" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">planning choice, not a</text>
<text x="1443" y="884" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">probability of safe operation</text>
<text x="1443" y="915" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#101828" font-weight="400" text-anchor="start">or an SLA guarantee.</text>
<text x="74" y="984" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#101828" font-weight="400" text-anchor="start">At 1%: 100 cases arrive against fluid capacity of 80. Starting empty, unresolved backlog</text>
<text x="74" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#101828" font-weight="400" text-anchor="start">grows by 20/day, reaching 100 after five working days.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">MODEL AND EVIDENCE LIMITS</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">These are derived scenarios, not observed customer results. The interval assumes independent trials and a complete, fixed</text>
<text x="87" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">follow-up window.</text>
<text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">METHOD  /  D = N × p × m / 60 • capacity = reviewer count × available hours • cap = floor(60 × H × u / (p × m))</text>
<text x="64" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="400" text-anchor="start">Analytic exhibit • All numbers derive from declared hypothetical assumptions • No customer measurement or safety guarantee</text>
<text x="1856" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="end">11</text>
</svg>