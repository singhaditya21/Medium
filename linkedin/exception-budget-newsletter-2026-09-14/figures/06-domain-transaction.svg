<text x="1020" y="679" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">Apply one state delta</text>
<text x="1020" y="708" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">Store outcome + outbox</text>
