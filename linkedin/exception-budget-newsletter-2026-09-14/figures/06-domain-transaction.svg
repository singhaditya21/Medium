<text x="1181" y="1012" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1457c5" font-weight="400" text-anchor="start">07  trusted outcome / change history</text>
<rect x="1660" y="214" width="197" height="875" rx="10" fill="white" stroke="#bfd2ef" stroke-width="2" />
<text x="1680" y="253" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">BOUNDARY</text>
<text x="1680" y="283" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">The outbox</text>
<text x="1680" y="313" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">relay may</text>
<text x="1680" y="343" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">deliver more</text>
<text x="1680" y="373" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">than once.</text>
<text x="1680" y="403" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">Each consumer</text>
<text x="1680" y="433" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">deduplicates</text>
<text x="1680" y="463" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">its own</text>
<text x="1680" y="493" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">supported</text>
<text x="1680" y="523" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">effects.</text>
<text x="1680" y="553" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">A refund or</text>
<text x="1680" y="583" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">message is a</text>
<text x="1680" y="613" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">new domain</text>
<text x="1680" y="643" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">action.</text>
<text x="1680" y="673" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">No</text>
<text x="1680" y="703" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">cross-system</text>
<text x="1680" y="733" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">exactly-once</text>
<text x="1680" y="763" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">claim.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">SYSTEM INVARIANT</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">When the CRM response is lost, resolve the original intent. Use a same-key retry only under a supported domain idempotency</text>
<text x="87" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">contract.</text>
<text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">OBSERVE  /  intent-key conflicts • duplicate delivery • commit-to-verification lag • unresolved action age</text>
<text x="64" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="400" text-anchor="start">Sequence notation • Solid arrow = request / evidence • Dashed response = lost delivery • Dashed vertical = participant lifeline</text>
<text x="1856" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="end">06</text>
