<text x="1020" y="528" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">LOCAL ATOMIC TRANSACTION</text>
<text x="1020" y="563" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">Resolve idempotency key</text>
<text x="1020" y="592" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">Reject changed payload</text>
<text x="1020" y="621" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#101828" font-weight="400" text-anchor="start">Check new-write authority</text>
