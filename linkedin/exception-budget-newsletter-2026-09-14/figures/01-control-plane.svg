<rect x="1440" y="213" width="416" height="877" rx="10" fill="white" stroke="#bfd2ef" stroke-width="2" />
<text x="1466" y="251" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1457c5" font-weight="700" text-anchor="start">IMPLEMENTATION CONTRACT</text>
<text x="1466" y="294" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Two independent gates</text>
<text x="1466" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">A policy grant permits an</text>
<text x="1466" y="363" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">exact action. A capacity</text>
<text x="1466" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">permit admits its expected</text>
<text x="1466" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">recovery load. Neither</text>
<text x="1466" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">substitutes for the other.</text>
<polyline points="1466,514 1830,514" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Feedback route</text>
<text x="1466" y="588" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Controller publishes a new</text>
<text x="1466" y="617" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">budget epoch to the allocator.</text>
<text x="1466" y="646" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Gateway checks capability</text>
<text x="1466" y="675" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">freshness before dispatch;</text>
<text x="1466" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">in-flight effects still need</text>
<text x="1466" y="733" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">reconciliation.</text>
<polyline points="1466,768 1830,768" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="802" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Isolation key</text>
<text x="1466" y="842" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">tenant × operation × region ×</text>
<text x="1466" y="871" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">risk tier. Allocate shared</text>
<text x="1466" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">human capacity once; do not</text>
<text x="1466" y="929" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">give each cell a copy of the</text>
<text x="1466" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">full pool.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">SYSTEM INVARIANT</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">A spare recovery slot never authorizes a prohibited action. Every dispatched write must remain attributable to one business</text>
<text x="87" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">intent.</text>
<text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">OBSERVE  /  admitted intents • verified outcomes • unresolved age • reserved / actual recovery minutes</text>
<text x="64" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="400" text-anchor="start">Author-proposed design • White = component / boundary • Solid arrow = execution or evidence • Dashed = policy / control</text>
<text x="1856" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="end">01</text>
