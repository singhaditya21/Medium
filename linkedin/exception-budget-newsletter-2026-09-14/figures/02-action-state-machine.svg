<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1360" viewBox="0 0 1920 1360" role="img"><title>Unknown is a durable state, not a retry instruction</title><desc>Business-action state and recovery accounting must survive process crashes and lost acknowledgements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1457c5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#bfd2ef" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1920" height="1360" rx="10" fill="white" stroke="none" stroke-width="2" />
<text x="64" y="46" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">THE OPERATING AI LEDGER  /  ENGINEERING SERIES</text>
<text x="1856" y="46" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="700" text-anchor="end">EXHIBIT 02  /  REFERENCE ARCHITECTURE</text>
<text x="64" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#101828" font-weight="700" text-anchor="start">Unknown is a durable state, not a retry instruction</text>
<text x="64" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">Business-action state and recovery accounting must survive process crashes and lost acknowledgements.</text>
<polyline points="64,181 1856,181" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<rect x="64" y="260" width="392" height="224" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="64" y="260" width="6" height="224" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="86" y="294" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">PROPOSED</text>
<text x="86" y="345" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Canonical intent frozen</text>
<text x="86" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">No side effect allowed</text>
<text x="86" y="399" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">No reservation yet</text>
<rect x="516" y="260" width="392" height="224" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="516" y="260" width="6" height="224" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="538" y="294" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">ADMITTED</text>
<text x="538" y="345" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Authority + capacity pass</text>
<text x="538" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Reservation is durable</text>
<text x="538" y="399" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Dispatch is fenced</text>
<rect x="968" y="260" width="392" height="224" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="968" y="260" width="6" height="224" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="990" y="294" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">DISPATCHED</text>
<text x="990" y="345" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Request sent to domain</text>
<text x="990" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Attempt_id recorded</text>
<text x="990" y="399" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Outcome may be unknown</text>
<rect x="64" y="670" width="392" height="224" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="64" y="670" width="6" height="224" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="86" y="704" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">CONTROLLED NO-EFFECT</text>
<text x="86" y="755" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Non-execution proven</text>
<text x="86" y="782" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Cancellation fenced</text>
<text x="86" y="809" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Release unused reserve</text>
<rect x="516" y="670" width="392" height="224" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="516" y="670" width="6" height="224" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="538" y="704" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">VERIFIED EFFECT</text>
<text x="538" y="755" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Postcondition established</text>
<text x="538" y="782" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Finalize outcome receipt</text>
<text x="538" y="809" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Retain history</text>
<rect x="968" y="670" width="392" height="224" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="968" y="670" width="6" height="224" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="990" y="704" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">UNRESOLVED</text>
<text x="990" y="755" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Lost response / mismatch</text>
<text x="990" y="782" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Keep owner + reservation</text>
<text x="990" y="809" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Resolve original action_id</text>
<polyline points="456,372.0 516,372.0" fill="none" stroke="#1457c5" stroke-width="2.5"  marker-end="url(#arrow)"/>
<polyline points="908,372.0 968,372.0" fill="none" stroke="#1457c5" stroke-width="2.5"  marker-end="url(#arrow)"/>
<polyline points="1164.0,484 1164.0,670" fill="none" stroke="#1457c5" stroke-width="2.5"  marker-end="url(#arrow)"/>
<polyline points="968,782.0 908,782.0" fill="none" stroke="#1457c5" stroke-width="2.5"  marker-end="url(#arrow)"/>
<polyline points="712.0,484 712.0,600 260.0,600 260.0,670" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="65" y="548" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1457c5" font-weight="700" text-anchor="start">CANCEL ONLY WITH A DISPATCH FENCE</text>
<text x="970" y="548" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1457c5" font-weight="700" text-anchor="start">TIMEOUT / INCOMPLETE EVIDENCE</text>
<text x="529" y="961" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1457c5" font-weight="700" text-anchor="start">RESOLVE ORIGINAL ID; DO NOT CREATE A NEW INTENT</text>
<text x="64" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">Admission denial remains a pre-dispatch outcome. An unresolved action can close as verified effect</text>
<text x="64" y="1045" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">or proven no-effect after reconciliation.</text>
<rect x="1440" y="213" width="416" height="877" rx="10" fill="white" stroke="#bfd2ef" stroke-width="2" />
<text x="1466" y="251" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1457c5" font-weight="700" text-anchor="start">IMPLEMENTATION CONTRACT</text>
<text x="1466" y="294" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Three identifiers</text>
<text x="1466" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">action_id = one business</text>
<text x="1466" y="363" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">intent; attempt_id = one</text>
<text x="1466" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">execution attempt; incident_id</text>
<text x="1466" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">= one investigation grouping.</text>
<text x="1466" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Counts are not</text>
<text x="1466" y="479" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">interchangeable.</text>
<polyline points="1466,514 1830,514" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Accounting ledger</text>
<text x="1466" y="588" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Keep unknown reserves</text>
<text x="1466" y="617" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">encumbered. Settlement records</text>
<text x="1466" y="646" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">actual work and releases</text>
<text x="1466" y="675" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">unused allocation. Closing a</text>
<text x="1466" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">case never erases spent hours.</text>
<polyline points="1466,768 1830,768" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="802" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Expiry semantics</text>
<text x="1466" y="842" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">An expired permission blocks a</text>
<text x="1466" y="871" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">new write. An expired process</text>
<text x="1466" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">lease does not prove an</text>
<text x="1466" y="929" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">earlier write failed. Transfer</text>
<text x="1466" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">ownership; reconcile before</text>
<text x="1466" y="987" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">releasing capacity.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">SYSTEM INVARIANT</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">Do not turn a timeout into a second business action. Terminal classification requires trusted evidence and a fenced dispatch</text>
<text x="87" y="1221" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">boundary.</text>
<text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">OBSERVE  /  unknown_count • oldest_unknown_age • duplicate attempts / action • definitive settlement coverage</text>
<text x="64" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="400" text-anchor="start">Author-proposed design • White = component / boundary • Solid arrow = execution or evidence • Dashed = policy / control</text>
<text x="1856" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="end">02</text>
</svg>