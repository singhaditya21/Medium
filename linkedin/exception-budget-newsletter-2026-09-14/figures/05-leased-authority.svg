<text x="1856" y="46" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="700" text-anchor="end">EXHIBIT 05  /  REFERENCE ARCHITECTURE</text>
<text x="64" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#101828" font-weight="700" text-anchor="start">Keep authority shorter-lived than the workflow</text>
