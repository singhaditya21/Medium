<text x="64" y="837" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1457c5" font-weight="700" text-anchor="start">03  /  REVOCATION AND RECOVERY</text>
<rect x="1440" y="213" width="416" height="877" rx="10" fill="white" stroke="#bfd2ef" stroke-width="2" />
<text x="1466" y="251" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1457c5" font-weight="700" text-anchor="start">IMPLEMENTATION CONTRACT</text>
<text x="1466" y="294" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Example fields</text>
<text x="1466" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">grant_id; actor; tenant;</text>
<text x="1466" y="363" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">operation; target;</text>
<text x="1466" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">intent_hash; audience;</text>
<text x="1466" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">expires_at; policy_version;</text>
<text x="1466" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">capability_epoch. Field names</text>
<text x="1466" y="479" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">are proposed, not a standard.</text>
<polyline points="1466,514 1830,514" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Revocation bound</text>
<text x="1466" y="588" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Effective stop latency depends</text>
<text x="1466" y="617" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">on propagation, cache TTL,</text>
<text x="1466" y="646" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">clock behavior and in-flight</text>
<text x="1466" y="675" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">dispatch. Measure it at the</text>
<text x="1466" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">domain boundary.</text>
<polyline points="1466,768 1830,768" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="802" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Proof boundary</text>
<text x="1466" y="842" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Sender-constrained tokens</text>
<text x="1466" y="871" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">protect token use. They do not</text>
<text x="1466" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">by themselves create one-use</text>
<text x="1466" y="929" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">business approval or</text>
<text x="1466" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">idempotent CRM mutations.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">SYSTEM INVARIANT</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">Neither an available exception budget nor an unexpired identity credential confers a standing right to change CRM state.</text>
<text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">OBSERVE  /  grant lifetime • revocation-to-enforcement latency • denied stale grants • direct-egress violations</text>
<text x="64" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="400" text-anchor="start">Author-proposed design • White = component / boundary • Solid arrow = execution or evidence • Dashed = policy / control</text>
<text x="1856" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="end">05</text>
