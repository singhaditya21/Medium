<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1360" viewBox="0 0 1920 1360" role="img"><title>Throttle the affected capability, preserve recovery</title><desc>Use explicit state transitions and independent safety stops; a quiet metric interval alone cannot clear an incident.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1457c5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#bfd2ef" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1920" height="1360" rx="10" fill="white" stroke="none" stroke-width="2" />
<text x="64" y="46" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">THE OPERATING AI LEDGER  /  ENGINEERING SERIES</text>
<text x="1856" y="46" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="700" text-anchor="end">EXHIBIT 09  /  REFERENCE ARCHITECTURE</text>
<text x="64" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" fill="#101828" font-weight="700" text-anchor="start">Throttle the affected capability, preserve recovery</text>
<text x="64" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#101828" font-weight="400" text-anchor="start">Use explicit state transitions and independent safety stops; a quiet metric interval alone cannot clear an incident.</text>
<polyline points="64,181 1856,181" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<rect x="64" y="285" width="555" height="235" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="64" y="285" width="6" height="235" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="86" y="319" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">NORMAL</text>
<text x="86" y="370" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Policy gates pass; budgets current</text>
<text x="86" y="397" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Admit within assigned pool quota</text>
<text x="86" y="424" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Continue verification and telemetry</text>
<text x="86" y="502" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">PER-CELL: TENANT × OPERATION × REGION</text>
<rect x="810" y="285" width="555" height="235" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="810" y="285" width="6" height="235" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="832" y="319" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">CONSTRAINED</text>
<text x="832" y="370" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Headroom or queue-age threshold hit</text>
<text x="832" y="397" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Reduce new affected writes</text>
<text x="832" y="424" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Keep evidence and recovery paths</text>
<text x="832" y="502" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">THRESHOLDS ARE OWNER-DEFINED</text>
<rect x="64" y="795" width="555" height="255" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="64" y="795" width="6" height="255" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="86" y="829" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">RECOVERY</text>
<text x="86" y="880" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Reconcile pending effects</text>
<text x="86" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Verify corrective actions</text>
<text x="86" y="934" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Demonstrate bounded backlog and age</text>
<text x="86" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">OWNER-APPROVED REENTRY</text>
<rect x="810" y="795" width="555" height="255" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<rect x="810" y="795" width="6" height="255" rx="0" fill="#1457c5" stroke="none" stroke-width="2" />
<text x="832" y="829" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1457c5" font-weight="400" text-anchor="start">HOLD</text>
<text x="832" y="880" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Block new affected writes</text>
<text x="832" y="907" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Fence stale dispatch permits</text>
<text x="832" y="934" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Keep unresolved obligations owned</text>
<text x="832" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1457c5" font-weight="700" text-anchor="start">HARD POLICY BREACH: IMMEDIATE STOP</text>
<polyline points="619,402.5 810,402.5" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<polyline points="1087.5,520 1087.5,795" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<polyline points="810,922.5 619,922.5" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<polyline points="341.5,795 341.5,520" fill="none" stroke="#1457c5" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="638" y="383" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">REDUCE</text>
<text x="638" y="884" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">RECONCILE</text>
<text x="1124" y="625" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="400" text-anchor="start">FRESHNESS FAILURE /</text>
<text x="1124" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="400" text-anchor="start">HARD CAP / SEVERITY</text>
<text x="64" y="625" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="400" text-anchor="start">EXIT GATES +</text>
<text x="64" y="651" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="400" text-anchor="start">AUTHORIZED REENTRY</text>
<rect x="1440" y="213" width="416" height="877" rx="10" fill="white" stroke="#bfd2ef" stroke-width="2" />
<text x="1466" y="251" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1457c5" font-weight="700" text-anchor="start">IMPLEMENTATION CONTRACT</text>
<text x="1466" y="294" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Separate triggers</text>
<text x="1466" y="334" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Hard authority breach stops</text>
<text x="1466" y="363" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">the relevant capability</text>
<text x="1466" y="392" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">regardless of capacity. Budget</text>
<text x="1466" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">pressure reduces admission.</text>
<text x="1466" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Missing critical telemetry can</text>
<text x="1466" y="479" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">force HOLD.</text>
<polyline points="1466,514 1830,514" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Hysteresis</text>
<text x="1466" y="588" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Use distinct entry and exit</text>
<text x="1466" y="617" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">thresholds, minimum evidence</text>
<text x="1466" y="646" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">windows and an owner decision.</text>
<text x="1466" y="675" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Choose values from the actual</text>
<text x="1466" y="704" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">service objective, not a</text>
<text x="1466" y="733" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">generic percentage.</text>
<polyline points="1466,768 1830,768" fill="none" stroke="#bfd2ef" stroke-width="2.5"  />
<text x="1466" y="802" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1457c5" font-weight="700" text-anchor="start">Cell isolation</text>
<text x="1466" y="842" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">A routing incident need not</text>
<text x="1466" y="871" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">stop safe evidence reads.</text>
<text x="1466" y="900" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">Shared identity compromise can</text>
<text x="1466" y="929" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">require a wider stop. The</text>
<text x="1466" y="958" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">incident owner selects the</text>
<text x="1466" y="987" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">containment scope.</text>
<rect x="64" y="1122" width="1792" height="125" rx="10" fill="white" stroke="#1457c5" stroke-width="2" />
<text x="87" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="start">SYSTEM INVARIANT</text>
<text x="87" y="1191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#101828" font-weight="400" text-anchor="start">Stopping new dispatch does not undo committed effects. Recovery and truthful outcome tracking remain active during HOLD.</text>
<text x="64" y="1290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#101828" font-weight="400" text-anchor="start">OBSERVE  /  state-change reason • containment latency • time in HOLD • unresolved age at reentry</text>
<text x="64" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1457c5" font-weight="400" text-anchor="start">Author-proposed design • White = component / boundary • Solid arrow = execution or evidence • Dashed = policy / control</text>
<text x="1856" y="1328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1457c5" font-weight="700" text-anchor="end">09</text>
</svg>